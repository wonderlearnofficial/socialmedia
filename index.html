<!doctype html>
<html lang="en" class="dark">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" href="/wonderlearn-mark.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Plan, visualize and approve social media content calendars." />
    <title>Wonderlearn — Content Calendar</title>
    <script>
      try {
        var s = JSON.parse(localStorage.getItem('cadence-settings') || '{}')
        var t = s.theme || 'dark'
        var dark = t === 'dark' || (t === 'system' && matchMedia('(prefers-color-scheme: dark)').matches)
        document.documentElement.classList.toggle('dark', dark)
        if (s.language === 'ar') {
          document.documentElement.lang = 'ar'
          document.documentElement.dir = 'rtl'
        }
      } catch (e) {
        /* keep dark default */
      }
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
